<script>
var sceneHistory = [];

var viewer = null;

var guideTimer = null;

function showGuideToast() {
  var toast = document.getElementById('guideToast');

  if (!toast) return;

  toast.style.display = 'block';

  if (guideTimer) {
    clearTimeout(guideTimer);
  }

  guideTimer = setTimeout(function() {
    toast.style.display = 'none';
    guideTimer = null;
  }, 3000);
}

function hideGuideToast() {
  var toast = document.getElementById('guideToast');

  if (!toast) return;

  toast.style.display = 'none';

  if (guideTimer) {
    clearTimeout(guideTimer);
    guideTimer = null;
  }
}


function openRoute(sceneId) {
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('viewerScreen').style.display = 'block';

  showGuideToast();

  setTimeout(function() {
    if (viewer) {
      viewer.resize();
      viewer.loadScene(sceneId);
    }
  }, 100);
}

function goHome() {
  hideGuideToast();
  sceneHistory = [];
  document.getElementById('viewerScreen').style.display = 'none';
  document.getElementById('menuScreen').style.display = 'flex';
}

function goBack() {
  hideGuideToast();
  if (sceneHistory.length > 0 && viewer) {
    var previousScene = sceneHistory.pop();
    viewer.loadScene(previousScene);
  }
}

function preloadImage(fileName) {
  const img = new Image();
  img.src = fileName;
}

function hotspot(hotSpotDiv, args) {

  // 다음 장면 미리 불러오기
  const nextScene = viewer.getConfig().scenes[args.target];

  if (nextScene && nextScene.panorama) {
    preloadImage(nextScene.panorama);
  }

  hotSpotDiv.onclick = function() {

    hideGuideToast();

    sceneHistory.push(viewer.getScene());

    viewer.loadScene(args.target);
  };
}

function goBack() {
  hideGuideToast();
  if (sceneHistory.length > 0) {
    var previousScene = sceneHistory.pop();
    viewer.loadScene(previousScene);
  }
}

function openRoute(sceneId) {
  sceneHistory = [];

  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('viewerScreen').style.display = 'block';

  showGuideToast();

  setTimeout(function() {
    viewer.resize();
    viewer.loadScene(sceneId);
  }, 100);
}

function goHome() {
  hideGuideToast();
  sceneHistory = [];

  document.getElementById('viewerScreen').style.display = 'none';
  document.getElementById('menuScreen').style.display = 'flex';
}
